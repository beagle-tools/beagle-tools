[package]
name = "beagle-agentd"
version = "0.29.0"
edition = "2021"
rust-version = "1.79"
description = "The always-on daemon that hosts beagle's agent engine."
license = "Apache-2.0"
repository = "https://github.com/beagle-tools/beagle-tools"

[lib]
name = "beagle_agentd"
path = "src/lib.rs"

[[bin]]
name = "beagle-agentd"
path = "src/main.rs"

[dependencies]
beagle-utils = { path = "../../utils" }
beagle = { path = "../tui" }
beagle-agent = { path = "../lib/agent" }

[lints]
workspace = true
