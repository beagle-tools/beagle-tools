[package]
name = "beagle-desktop"
version = "0.29.0"
description = "Beagle desktop app: a native viewer for RCA workspaces"
authors = ["Matthew Myrick"]
license = "MIT"
repository = "https://github.com/beagle-tools/beagle-tools"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "beagle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary is named "Beagle" (not the crate name) so `tauri dev` runs
# an executable called Beagle — macOS shows the executable name in the
# dock and menu bar in dev, and this is what makes it say "Beagle" there.
# Matches `mainBinaryName` in tauri.conf.json; bundled builds already use
# `productName`.
[[bin]]
name = "Beagle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The whole domain layer — model, store, markdown, similar — comes from
# the CLI crate. The desktop app is a renderer, not a second
# implementation of the data format.
beagle = { path = "../../cli" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Self-update: signed bundles from the `beagle-rca-latest` mirror release
# (plus any versioned release, for rollback), then relaunch.
tauri-plugin-process = "~2.3"
tauri-plugin-updater = "~2.12"
# Lists the monorepo's releases for the version picker. The same reqwest the
# updater plugin already compiles (its TLS backend is enabled through the
# plugin's default features), so this adds no second HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"

[lints]
workspace = true

# Its own workspace root: built by the Tauri toolchain with its own Cargo.lock,
# separate from ../../Cargo.toml (which excludes `desktop/`).
[workspace]
members = ["."]

# Copied verbatim from ../../../standards/cargo-lints.toml (drift-checked).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
