kind: Agent
name: review-pr
runner: claude
workdir: ~
prompt: prompts/review-pr.md
# Bash runs `beagle tandem ingest` / `fail`; Read and Write handle the
# context and the review file. Nothing here can reach GitHub: the context
# carries the PR, and posting stays a keypress in the TUI.
allowed_tools: [Bash, Read, Write]
# The TUI treats a review still running after 45 minutes as dead.
timeout_minutes: 30

# A step: demo/review-queue triggers it once per claimed PR.
entrypoint: false
