# Agentdesk is its own cargo workspace, separate from ../Cargo.toml: it pulls
# in Tauri and a node toolchain, which the daemon/CLI crates should not need
# to build or test. CI gates both (see `make check-workflows` at repo root).
[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/beagle-tools/beagle-tools"

[workspace.dependencies]
# The whole point: the desktop app reads the SAME store the daemon writes.
# No second source of truth, no sync protocol — agenttop and agentdesk are
# two views of one SQLite file.
agent-core = { path = "../crates/agent-core" }
beagle-utils = { path = "../../utils" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# The release list for in-app version switching (tauri-plugin-updater
# already pulls reqwest in, so this adds no new HTTP stack).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
