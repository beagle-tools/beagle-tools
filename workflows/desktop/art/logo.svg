<!-- macOS app icon, on Apple's Big Sur grid: the art is NOT full-bleed.
     The squircle body is 824x824 centred inside a 1024 canvas (100px of
     transparent margin all round) with a 185.4 corner radius. A
     full-bleed icon renders visibly larger than every stock app beside
     it in the Dock, because the system adds no padding of its own. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272b3b"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#bg)"/>
  </g>

  <!-- A DAG: a root fanning out to three stages, which is the app. -->
  <g stroke="#7aa2f7" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M512 380 L354 560"/>
    <path d="M512 380 L512 560"/>
    <path d="M512 380 L670 560"/>
  </g>
  <circle cx="512" cy="380" r="66" fill="#7aa2f7"/>
  <circle cx="354" cy="624" r="54" fill="#9ece6a"/>
  <circle cx="512" cy="624" r="54" fill="#e0af68"/>
  <circle cx="670" cy="624" r="54" fill="#f7768e"/>
</svg>
