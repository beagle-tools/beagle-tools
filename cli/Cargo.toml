[workspace]
resolver = "2"
# Every tool is a library crate under crates/; `crates/beagle` links them
# all into the one `beagle` binary. A glob, so adding a tool never edits
# this list.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/beagle-tools/beagle-tools"

[workspace.dependencies]
beagle-utils = { path = "../utils" }
# Tools that live with their own app. rca's crate is named `beagle`, so it
# is renamed here to say which tool it is.
beagle-rca = { package = "beagle", path = "../rca/cli" }
beagle-recap = { path = "crates/recap" }
beagle-scout = { path = "crates/scout" }
beagle-serve = { path = "crates/serve" }
beagle-standup = { path = "crates/standup" }
beagle-tui = { path = "../utils/tui" }
tandem-cache = { path = "../tandem/crates/tandem-cache" }
tandem-cli = { path = "../tandem/crates/tandem-cli" }
tandem-tui = { path = "../tandem/crates/tandem-tui" }
crossterm = "0.28"
notify = "7"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: `beagle scout hook install` rewrites ~/.claude/settings.json
# and must keep the user's key order.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
toml = "0.8"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
