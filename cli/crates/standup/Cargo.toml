[package]
name = "beagle-standup"
description = "beagle standup: a TUI for standup reports — one big-picture overview, then a short write-up per ticket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "standup"
path = "src/lib.rs"

[dependencies]
beagle-tui.workspace = true
beagle-utils.workspace = true
crossterm.workspace = true
notify.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
