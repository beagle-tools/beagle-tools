[package]
name = "beagle-serve"
description = "beagle serve: the beagle tools' stores as a read-only HTTPS JSON API for the phone app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
beagle-rca.workspace = true
beagle-scout.workspace = true
beagle-utils.workspace = true
# rustls (ring provider) is already in this workspace's lockfile through
# reqwest; the server reuses it rather than adding a second TLS stack.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
