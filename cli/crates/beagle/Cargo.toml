[package]
name = "beagle-cli"
description = "The `beagle` command: every beagle-tools tool behind one binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "beagle"
path = "src/main.rs"

[dependencies]
beagle-rca.workspace = true
beagle-recap.workspace = true
beagle-scout.workspace = true
beagle-standup.workspace = true
beagle-tui.workspace = true
beagle-utils = { workspace = true, features = ["update"] }
tandem-cli.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
