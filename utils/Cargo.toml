[package]
name = "beagle-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
description = "Small std-only helpers shared by the beagle-tools apps (tandem, rca, workflows)."
publish = false

[lib]
name = "beagle_utils"
path = "src/lib.rs"

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]
# The GitHub CLI (`gh`): bounded runs and PR state, parsed from its JSON.
gh = ["dep:serde", "dep:serde_json"]
# Self-update against GitHub releases (`update`): parses the releases feed.
update = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

