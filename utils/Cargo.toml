[package]
name = "beagle-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
description = "Small std-only helpers shared by the beagle-tools apps (tandem, rca, workflows)."
publish = false

[lib]
name = "beagle_utils"
path = "src/lib.rs"

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace]
members = ["."]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
