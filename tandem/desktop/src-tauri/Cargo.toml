[package]
name = "tandem"
description = "Tandem — local-first code review that works with your agents"
authors = ["Matthew Myrick"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows.
name = "tandem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tandem-core.workspace = true
beagle-utils = { workspace = true, features = ["tracing"] }
tandem-github.workspace = true
tandem-cache.workspace = true
tandem-agents.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

serde.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
tracing.workspace = true

# These plugins only exist on desktop platforms.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[lints]
workspace = true

# Its own workspace root (docs/LAYOUT.md, rule 7): built by the Tauri
# toolchain with its own Cargo.lock, separate from the repo-root workspace
# (which excludes it). tandem's crates come in as path dependencies.
[workspace]
members = ["."]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tandem-core = { path = "../../lib/core" }
tandem-github = { path = "../../lib/github" }
tandem-cache = { path = "../../lib/cache" }
tandem-agents = { path = "../../lib/agents" }
beagle-utils = { path = "../../../utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "io-util", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dirs = "5"

# Copied verbatim from ../../../standards/cargo-lints.toml (drift-checked).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Tauri recommends these for smaller bundles; profiles must live at the
# workspace root or cargo ignores them.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
