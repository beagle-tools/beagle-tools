[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/tandem-core",
  "crates/tandem-github",
  "crates/tandem-cache",
  "crates/tandem-agents",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/beagle-tools/beagle-tools"

[workspace.dependencies]
tandem-core = { path = "crates/tandem-core" }
tandem-github = { path = "crates/tandem-github" }
tandem-cache = { path = "crates/tandem-cache" }
tandem-agents = { path = "crates/tandem-agents" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "io-util", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dirs = "5"
beagle-utils = { path = "../utils" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Tauri recommends these for smaller bundles; profiles must live at the
# workspace root or cargo ignores them.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
