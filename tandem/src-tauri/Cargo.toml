[package]
name = "tandem"
description = "Tandem — local-first code review that works with your agents"
authors = ["Matthew Myrick"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows.
name = "tandem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tandem-core.workspace = true
beagle-utils = { workspace = true, features = ["tracing"] }
tandem-github.workspace = true
tandem-cache.workspace = true
tandem-agents.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

serde.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
tracing.workspace = true

# These plugins only exist on desktop platforms.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[lints]
workspace = true
