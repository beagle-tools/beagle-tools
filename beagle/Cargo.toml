[package]
name = "beagle-cli"
description = "The `beagle` command: every beagle-tools tool behind one binary"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "beagle"
path = "src/main.rs"
# rca's lib is also named `beagle`, and both live in the root workspace:
# documenting this bin too would write the same target/doc/beagle/.
doc = false

[dependencies]
agentctl.workspace = true
beagle-agentd.workspace = true
beagle-rca.workspace = true
beagle-recap.workspace = true
beagle-scout.workspace = true
beagle-serve.workspace = true
beagle-standup.workspace = true
beagle-tui.workspace = true
beagle-utils = { workspace = true, features = ["update"] }
tandem-cli.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
