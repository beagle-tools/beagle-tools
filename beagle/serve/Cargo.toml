[package]
name = "beagle-serve"
description = "beagle serve: the beagle tools' stores as a read-only HTTPS JSON API for the phone app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
beagle-rca.workspace = true
beagle-recap.workspace = true
beagle-scout.workspace = true
beagle-standup.workspace = true
beagle-tui.workspace = true
beagle-utils.workspace = true
# The APNs provider-token JWT and the .p8 key are base64 (PEM and base64url).
base64.workspace = true
# rustls (ring provider) is already in this workspace's lockfile through
# reqwest; the server reuses it rather than adding a second TLS stack.
# The pairing QR code; no default features, so no image/SVG stack and no
# transitive dependencies.
qrcode = { version = "0.15", default-features = false, features = ["std"] }
# APNs speaks only HTTP/2: the workspace's reqwest (already used blocking by
# tandem) with its http2 feature, which adds the `h2` crate
# (docs/serve-push.md, "Transport").
reqwest = { workspace = true, features = ["blocking", "http2"] }
# Signs the APNs JWT (ES256) with the .p8 key; already in the lockfile
# through rustls.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tandem-tui.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true

[dev-dependencies]
# A fake APNs server (HTTP/2) in tests: the same h2/http/tokio reqwest uses.
bytes = "1"
h2 = "0.4"
http = "1"
# A throwaway self-signed certificate for the loopback TLS test (same ring
# provider as the server).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Decodes the drawn pairing QR code in tests, as a phone camera would.
rqrr = { version = "0.11", default-features = false }
tandem-cache.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
