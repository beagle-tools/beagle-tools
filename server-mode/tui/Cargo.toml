[package]
name = "beagle-server-mode"
description = "beagle server-mode: keep a Mac awake as a server while the screen locks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "server_mode"
path = "src/lib.rs"

[dependencies]
# `on` starts and stops beagle serve and reads its config.
beagle-serve.workspace = true
beagle-utils.workspace = true
# The server's local health check (`GET /v1/health`), blocking like serve.
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
time.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
