name: ci

# The one CI pipeline for the monorepo, and its merge gate: if `gate` is
# green, the change is safe to merge. Branch protection should require
# exactly the `gate` job — it always runs, and fails if any gate that ran
# failed or was cancelled. Gates for apps a PR doesn't touch are skipped,
# not left pending.
#
# Every app gets the same checks from the same scripts (scripts/ci/*.sh,
# scripts/check-*.{sh,mjs}); `make check` runs them identically locally.
#
# Two levels of selection: `changes` skips whole apps a PR doesn't touch;
# inside a Rust gate that runs, pull requests test only the cargo packages
# the diff affects (scripts/ci/affected.mjs, see docs/TESTING.md). Pushes to
# main test every package of every gated workspace.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changed apps
    runs-on: ubuntu-latest
    outputs:
      utils: ${{ steps.filter.outputs.utils }}
      tandem: ${{ steps.filter.outputs.tandem }}
      rca: ${{ steps.filter.outputs.rca }}
      workflows: ${{ steps.filter.outputs.workflows }}
      beagle: ${{ steps.filter.outputs.beagle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # Shared tooling and the shared crate re-run every app's gates.
          filters: |
            shared: &shared
              - ".github/workflows/ci.yml"
              - ".github/workflows/_rust.yml"
              - ".github/workflows/_frontend.yml"
              - "scripts/**"
              - "standards/**"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              # The one root cargo workspace (docs/LAYOUT.md).
              - "Cargo.toml"
              - "Cargo.lock"
              - ".nvmrc"
              - ".prettierrc.json"
              - "utils/**"
            utils:
              - *shared
            tandem:
              - *shared
              - "tandem/**"
            rca:
              - *shared
              - "rca/**"
              - ".claude/skills/**"
              - "skills/**"
            workflows:
              - *shared
              - "workflows/**"
            beagle:
              - *shared
              - "beagle/**"
              # Tools that still live in cli/ until they move.
              - "cli/**"
              # Linked into the `beagle` binary or embedded in it (the rca
              # skills); scripts/release/linked.test.mjs checks this list.
              - "rca/cli/**"
              - "tandem/crates/tandem-cli/**"
              - "tandem/crates/tandem-core/**"
              - "tandem/crates/tandem-tui/**"
              - "tandem/crates/tandem-cache/**"
              - "tandem/crates/tandem-github/**"
              - "rca/crates/beagle-agentd/**"
              - "rca/crates/beagle-agent/**"
              - "workflows/crates/agent-core/**"
              - "workflows/crates/agentctl/**"
              - "workflows/crates/agentd/**"
              - "workflows/crates/agenttop/**"
              - "workflows/deploy/**"
              - "workflows/assets/notify/**"
              - "workflows/scripts/build-notifier.sh"
              - "skills/beagle/**"
              - "skills/beagle-review/**"

  standards:
    name: standards (400-line rule, affiliation, shared config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The affiliation guard checks commit emails since origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: ./scripts/check-file-length.sh
      # Fork PRs get no secrets, so they skip this step rather than fail
      # it. Run `make standards` locally before merging one; the push to
      # main re-runs it with the secret either way.
      - name: affiliation guard (patterns come from a secret, never the repo)
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: ./scripts/check-affiliation.sh
        env:
          BEAGLE_AFFILIATION_PATTERNS: ${{ secrets.BEAGLE_AFFILIATION_PATTERNS }}
          BEAGLE_AFFILIATION_REQUIRED: "1"
      - name: commit emails are GitHub noreply addresses
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: ./scripts/check-commit-email.sh
      - run: node scripts/check-standards.mjs
      - name: unit tests for the CI and release scripts
        run: node --test scripts/ci/*.test.mjs scripts/release/*.test.mjs beagle/scripts/*.test.mjs

  # The root cargo workspace: every crate except the Tauri shells. Runs when
  # any app's paths change; on pull requests, affected.mjs then tests only
  # the packages the diff reaches.
  rust:
    needs: changes
    if: >-
      needs.changes.outputs.utils == 'true' || needs.changes.outputs.tandem == 'true' ||
      needs.changes.outputs.rca == 'true' || needs.changes.outputs.workflows == 'true' ||
      needs.changes.outputs.beagle == 'true'
    uses: ./.github/workflows/_rust.yml
    with:
      affected-base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      dir: .

  tandem-desktop-rust:
    needs: changes
    if: needs.changes.outputs.tandem == 'true'
    uses: ./.github/workflows/_rust.yml
    with:
      affected-base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      dir: tandem/src-tauri
      tauri: true

  tandem-frontend:
    needs: changes
    if: needs.changes.outputs.tandem == 'true'
    uses: ./.github/workflows/_frontend.yml
    with:
      dir: tandem

  rca-desktop-rust:
    needs: changes
    if: needs.changes.outputs.rca == 'true'
    uses: ./.github/workflows/_rust.yml
    with:
      affected-base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      dir: rca/desktop/src-tauri
      tauri: true

  rca-desktop-frontend:
    needs: changes
    if: needs.changes.outputs.rca == 'true'
    uses: ./.github/workflows/_frontend.yml
    with:
      dir: rca/desktop

  rca-web:
    needs: changes
    if: needs.changes.outputs.rca == 'true'
    uses: ./.github/workflows/_frontend.yml
    with:
      dir: rca/web

  # The release workflow pushes this image; building it here keeps a broken
  # Dockerfile from ever reaching main.
  rca-web-image:
    name: rca web image (build only)
    needs: changes
    if: needs.changes.outputs.rca == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rca
          build-contexts: standards=standards
          file: rca/web/Dockerfile
          push: false

  workflows-desktop-rust:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_rust.yml
    with:
      affected-base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      dir: workflows/desktop
      tauri: true

  workflows-desktop-frontend:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_frontend.yml
    with:
      dir: workflows/desktop

  gate:
    name: gate
    if: always()
    needs:
      - changes
      - standards
      - rust
      - tandem-desktop-rust
      - tandem-frontend
      - rca-desktop-rust
      - rca-desktop-frontend
      - rca-web
      - rca-web-image
      - workflows-desktop-rust
      - workflows-desktop-frontend
    runs-on: ubuntu-latest
    steps:
      - name: every gate that ran is green
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a gate failed or was cancelled — not mergeable"
          exit 1
      - run: echo "all gates green — safe to merge"
