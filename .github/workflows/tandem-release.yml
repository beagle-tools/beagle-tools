name: tandem-release

# Continuous delivery for the Tandem desktop app (tandem/): every push to
# main that touches app code cuts a GitHub Release with desktop installers
# (Windows .exe/.msi, macOS .dmg for arm + intel, Linux .AppImage/.deb)
# plus signed updater bundles and a latest.json manifest that the in-app
# updater polls.
#
# Monorepo tag/release conventions: `v*` and `releases/latest` belong to
# the rca CLI (see rca-release*.yml), so Tandem releases are tagged
# `tandem-vX.Y.Z` and are never marked `latest`. Instead, a rolling
# `tandem-latest` release carries stable-named copies of the newest
# installers plus latest.json — those
# releases/download/tandem-latest/<name> URLs back the updater endpoint,
# tandem/scripts/install.sh, install.ps1, and the Homebrew cask.
#
# Versioning: if the merge commit already carries a tandem-v* tag, that
# tag is released as-is. Otherwise the latest tandem-v* tag is bumped
# according to the merged PR's release:major / release:minor /
# release:patch label (default: patch; no tags yet -> the version in
# tandem/src-tauri/tauri.conf.json).
#
# Only app code triggers a release — the paths filter below skips
# docs/markdown/CI-only merges (including changes to this workflow
# itself: if the app doesn't change, there's no release).
#
# Queue race: runs serialize via the concurrency group, so a queued run
# can wake up after newer merges landed. It skips itself — the newer
# push's run releases everything.
#
# Required repo secret: TAURI_SIGNING_PRIVATE_KEY (updater signing key;
# generated with `pnpm tauri signer generate`, no password).
on:
  push:
    branches: [main]
    paths:
      - "tandem/src/**"
      - "tandem/src-tauri/**"
      - "tandem/crates/**"
      - "tandem/Cargo.toml"
      - "tandem/Cargo.lock"
      - "tandem/package.json"
      - "tandem/pnpm-lock.yaml"
      - "tandem/index.html"
      - "tandem/public/**"
      - "tandem/vite.config.ts"
      - "tandem/tsconfig.json"
      - "tandem/tsconfig.node.json"
      - "tandem/scripts/set-version.mjs"
      # Shared inputs baked into the binary: the beagle-utils crate and the
      # pinned toolchain.
      - "utils/**"
      - "rust-toolchain.toml"

concurrency:
  group: tandem-release-main
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: tandem

jobs:
  version:
    name: compute + push tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: determine version (existing tag, else bump by PR label)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(git tag --points-at HEAD 'tandem-v*' | sort -V | tail -n1)
          if [ -n "$existing" ]; then
            tag="$existing"
            echo "HEAD already tagged $tag — releasing that version"
          else
            # This run may have waited in the concurrency queue while
            # newer commits merged; that newer push has its own run, so
            # releasing this stale commit would be wrong (and GitHub
            # rejects the tag push if workflows changed since).
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$GITHUB_SHA" != "$tip" ]; then
              echo "main moved on to $tip — skipping; the newer run releases"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            latest=$(git tag -l 'tandem-v*' | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              tag="tandem-v$(node -p "require('./src-tauri/tauri.conf.json').version")"
              echo "no tags yet — starting at $tag"
            else
              # Bump size comes from the merged PR's release:* label
              # (via the commit->PR association); default is patch.
              bump=patch
              labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '[.[].labels[].name] | join("\n")' 2>/dev/null || true)
              if echo "$labels" | grep -qx "release:major"; then
                bump=major
              elif echo "$labels" | grep -qx "release:minor"; then
                bump=minor
              fi
              IFS=. read -r maj min pat <<<"${latest#tandem-v}"
              case $bump in
                major) tag="tandem-v$((maj + 1)).0.0" ;;
                minor) tag="tandem-v${maj}.$((min + 1)).0" ;;
                patch) tag="tandem-v${maj}.${min}.$((pat + 1))" ;;
              esac
              echo "$bump bump: $latest -> $tag"
            fi
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#tandem-v}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: windows
            platform: windows-latest
            args: ""
          - name: linux
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install tauri system deps (linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      # Same Node/pnpm setup as CI (_frontend.yml): Node from .nvmrc, pnpm
      # pinned by tandem/package.json's packageManager via corepack.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: enable corepack (pnpm pinned by packageManager)
        run: corepack enable
      - name: locate pnpm store
        id: pnpm-store
        shell: bash
        working-directory: tandem
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-tandem-${{ hashFiles('tandem/pnpm-lock.yaml') }}

      # Same toolchain as CI: rust-toolchain.toml at the repo root.
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: add macOS cross targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tandem
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile

      - name: stamp release version
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}

      - name: build + upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: tandem
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Tandem v${{ needs.version.outputs.version }}
          releaseBody: >
            Installers: Windows `-setup.exe` / `.msi`, macOS `.dmg`
            (arm64 + x64), Linux `.AppImage` / `.deb`. Running apps
            pick this release up via the in-app update button.
          # Stay a draft until every platform uploaded — a half-built
          # release must never reach updaters (platforms that aren't
          # merged into latest.json yet would error out).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri names bundles with the version (Tandem_0.0.2_aarch64.dmg),
      # so also upload stable-named copies — the publish job mirrors
      # these onto the rolling tandem-latest release.
      - name: upload stable-named assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          case "${{ matrix.name }}" in
            macos-arm)
              cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
                "$stage/Tandem-macos-arm64.dmg" ;;
            macos-intel)
              cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
                "$stage/Tandem-macos-x64.dmg" ;;
            windows)
              cp target/release/bundle/nsis/*-setup.exe \
                "$stage/Tandem-windows-x64-setup.exe" ;;
            linux)
              cp target/release/bundle/appimage/*.AppImage \
                "$stage/Tandem-linux-x86_64.AppImage"
              cp target/release/bundle/deb/*.deb \
                "$stage/Tandem-linux-amd64.deb" ;;
          esac
          gh release upload "$TAG" "$stage"/* --clobber

  # Flip the draft live only after every platform built and uploaded,
  # then mirror its stable-named assets + latest.json onto tandem-latest
  # — that mirror is what updaters and install scripts see. If any build
  # fails, the draft stays hidden and tandem-latest is untouched.
  publish:
    name: publish release
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: publish release + update tandem-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # /releases/tags/<tag> can't see drafts — list and filter.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            echo "no release found for ${TAG}" >&2
            exit 1
          fi
          # Never `latest` — that pointer belongs to the rca CLI.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
            -F draft=false -f make_latest=false >/dev/null
          echo "published ${TAG}"

          stage=$(mktemp -d)
          gh release download "$TAG" --dir "$stage" \
            --pattern 'Tandem-*' --pattern 'latest.json'
          if ! gh release view tandem-latest >/dev/null 2>&1; then
            gh release create tandem-latest --target "$GITHUB_SHA" \
              --title "Tandem (latest)" --latest=false \
              --notes "Rolling mirror of the newest tandem-v* release — stable download URLs for installers and the in-app updater."
          fi
          gh release upload tandem-latest "$stage"/* --clobber
          echo "tandem-latest now mirrors ${TAG}"
