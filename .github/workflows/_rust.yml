name: rust gate

# Reusable Rust gate for one cargo workspace. The steps live in
# scripts/ci/rust.sh so `make check` runs the identical thing locally.
on:
  workflow_call:
    inputs:
      dir:
        description: cargo workspace directory, relative to the repo root
        required: true
        type: string
      tauri:
        description: install the Linux system libraries Tauri links against
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ inputs.dir }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tauri system deps
        if: inputs.tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.dir }}
      - run: ./scripts/ci/rust.sh "${{ inputs.dir }}"
